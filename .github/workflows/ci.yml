name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no floating major tags since v8, so the full version is pinned.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Same version as in the Dockerfile; keeps `uv export` output stable.
          version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Deployment requirements match uv.lock
        run: make check-app-requirements

      # Tests use synthetic fixtures only; no Kaggle credentials or real data needed.
      - name: Test
        run: make test
